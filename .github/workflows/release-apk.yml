name: Android APKs

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-apks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the secrets under Settings > Secrets and variables > Actions."
            echo "See the 'Android builds' section of README.md for how to generate them."
            exit 1
          fi

      - name: Decode and check keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/dulcerelax.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          if [ ! -s "$keystore" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to a file"
            exit 1
          fi
          keytool -list -keystore "$keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null

      - name: Add Firebase config for the admin app (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 is not set: the admin APK will be built without FCM push notifications."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 --decode > DulceRelax.App.Admin/google-services.json
          test -s DulceRelax.App.Admin/google-services.json

      # Passwords go through the `env:` prefix so they never appear in the build log.
      # The keystore path, alias and signing flag are not sensitive.
      - name: Publish client APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          dotnet publish DulceRelax.App.Cliente \
            -f net9.0-android \
            -c Release \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/dulcerelax.keystore" \
            -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD

      - name: Publish admin APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          dotnet publish DulceRelax.App.Admin \
            -f net9.0-android \
            -c Release \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/dulcerelax.keystore" \
            -p:AndroidSigningKeyAlias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD

      - name: Collect signed APKs
        run: |
          set -euo pipefail
          mkdir -p artifacts
          count=0
          for app in DulceRelax.App.Cliente DulceRelax.App.Admin; do
            out="$app/bin/Release/net9.0-android"
            # dotnet publish copies the final package to publish/ (or <rid>/publish/).
            mapfile -t apks < <(find "$out" -type f -iname "*-signed.apk" -path "*/publish/*" | sort)
            if [ "${#apks[@]}" -eq 0 ]; then
              mapfile -t apks < <(find "$out" -type f -iname "*-signed.apk" | sort)
            fi
            if [ "${#apks[@]}" -eq 0 ]; then
              echo "::error::No signed APK was produced for $app. Check the signing properties."
              exit 1
            fi
            for apk in "${apks[@]}"; do
              name="$(basename "$apk")"
              if [ -e "artifacts/$name" ]; then
                # Same package built for several RIDs: keep both with a RID suffix.
                if cmp -s "$apk" "artifacts/$name"; then
                  echo "Skipping duplicate $apk"
                  continue
                fi
                rid="$(printf '%s' "$apk" | grep -oE 'android-(arm64|x64|arm|x86)' | head -n1 || true)"
                name="${name%.apk}-${rid:-universal}.apk"
                if [ -e "artifacts/$name" ]; then
                  echo "::error::Two different APKs map to artifacts/$name"
                  exit 1
                fi
              fi
              cp "$apk" "artifacts/$name"
              count=$((count + 1))
            done
          done
          echo "Collected $count signed APK(s):"
          ls -lh artifacts

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          apksigner="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "$apksigner" ]; then
            echo "::warning::apksigner not found; skipping signature verification"
            exit 0
          fi
          for apk in artifacts/*.apk; do
            echo "== $apk"
            "$apksigner" verify --print-certs "$apk"
          done

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dulcerelax-apks
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Attach APKs to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          fail_on_unmatched_files: true
