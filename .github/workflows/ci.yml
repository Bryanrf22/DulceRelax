name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore API and tests
        run: |
          dotnet restore DulceRelax.API/DulceRelax.API.csproj
          dotnet restore DulceRelax.Tests/DulceRelax.Tests.csproj

      - name: Build API
        run: dotnet build DulceRelax.API/DulceRelax.API.csproj -c Release --no-restore

      - name: Run business rule tests
        run: dotnet test DulceRelax.Tests/DulceRelax.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"
